  force = true

# Stray duplicate copy of an older site version
[[redirects]]
  from = "/whydoweneedai.com/*"
  to = "/404"
  status = 404
  force = true

# Unreferenced backup of an old placeholder homepage
[[redirects]]
  from = "/index_placeholder_backup.html"
  to = "/404"
  status = 404
  force = true

# This config file itself
[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true

# Internal build/source files (not linked from public pages)
[[redirects]]
