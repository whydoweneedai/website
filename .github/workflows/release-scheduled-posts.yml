# Publishes scheduled blog posts on their date.
#
# Runs once a day. When no post is due it stops after a few seconds and
# changes nothing, so there is no commit and no Netlify deploy. When a post is
# due it moves the page into blog/, regenerates the site and pushes one commit
# to main; Netlify then deploys that commit as usual.
# How to schedule a post: README.md, "Scheduling a post".
name: Release scheduled posts

on:
  schedule:
    # 11:05 UTC = 6:05 AM New York in winter, 7:05 AM in summer.
    - cron: "5 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-scheduled-posts
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Anything due today?
        id: due
        run: python3 scripts/release-due-posts.py --check

      - uses: actions/setup-python@v6
        if: steps.due.outputs.due == 'true'
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v5
        if: steps.due.outputs.due == 'true'
        with:
          node-version: "22"

      - name: Release and regenerate
        if: steps.due.outputs.due == 'true'
        run: |
          python -m pip install --quiet "pillow==13.0.0"
          python scripts/release-due-posts.py
          python scripts/check-schedule.py

      - name: Commit and push to main
        if: steps.due.outputs.due == 'true'
        env:
          SLUGS: ${{ steps.due.outputs.slugs }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Publish scheduled posts: ${SLUGS}"
          git push origin HEAD:main
