<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>Mobile screenshot helper</title>
<style>
html,body{margin:0;width:390px;min-width:390px;max-width:390px;height:844px;overflow:hidden;background:#fff}
iframe{display:block;border:0;width:390px;height:844px}
</style>
</head>
<body>
<iframe id="viewport" title="Mobile preview"></iframe>
<script>
const allowed = {
  home: "/",
  article: "/blog/can-ai-enter-invoices-spreadsheet-test/",
  readyscore: "/ai-readyscore/"
};
document.getElementById("viewport").src = allowed[new URLSearchParams(location.search).get("page")] || "/";
</script>
</body>
</html>
